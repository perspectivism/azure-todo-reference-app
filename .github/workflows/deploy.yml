# Manual redeployment of an already bootstrapped environment. Authenticates to Azure with GitHub OIDC as the
# todo-deployer service principal (no stored Azure credential). Never creates or changes Entra app registrations:
# deploy.ps1 -Yes skips setup-entra.ps1 and makes no Microsoft Graph calls. See docs/deployment.md.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Build and test
        run: |
          dotnet restore TodoApp.slnx
          dotnet build TodoApp.slnx --no-restore -c Release -p:TreatWarningsAsErrors=true
          dotnet test tests/Todo.UnitTests/Todo.UnitTests.csproj --no-build -c Release

      - name: Publish and package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          dotnet publish src/Todo.Api/Todo.Api.csproj -c Release -o out/api --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet publish src/Todo.Web/Todo.Web.csproj -c Release -o out/web --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path out/api/* -DestinationPath packages/api.zip
          Compress-Archive -Path out/web/* -DestinationPath packages/web.zip

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages
          path: packages/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      # Non-secret configuration from GitHub Environment/repository variables (see docs/deployment.md).
      TODOAPP_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      TODOAPP_API_CLIENT_ID: ${{ vars.TODOAPP_API_CLIENT_ID }}
      TODOAPP_WEB_CLIENT_ID: ${{ vars.TODOAPP_WEB_CLIENT_ID }}
      TODOAPP_BUDGET_EMAIL: ${{ vars.TODOAPP_BUDGET_EMAIL }}
      TODOAPP_LOCATION: ${{ vars.TODOAPP_LOCATION }}
      TODOAPP_NAME_PREFIX: ${{ vars.TODOAPP_NAME_PREFIX }}
      TODOAPP_WEB_PLAN_SKU: ${{ vars.TODOAPP_WEB_PLAN_SKU }}
      TODOAPP_BUDGET_AMOUNT: ${{ vars.TODOAPP_BUDGET_AMOUNT }}
      TODOAPP_LOG_DAILY_CAP_GB: ${{ vars.TODOAPP_LOG_DAILY_CAP_GB }}
    steps:
      - name: Checkout (scripts and infrastructure)
        uses: actions/checkout@v7.0.1

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages
          path: packages

      - name: Azure login (OIDC, todo-deployer)
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Deploy (non-interactive redeployment, includes /health and anonymous-rejection smoke tests)
        shell: pwsh
        run: ./scripts/deploy.ps1 -Environment $env:DEPLOY_ENVIRONMENT -Yes -PackageDirectory ./packages
